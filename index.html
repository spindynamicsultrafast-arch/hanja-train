<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="darkreader-lock">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>한자 기차여행</title>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--w:760px;--card-h:clamp(110px,17vh,150px);--t-title:34px;--t-sub:22px;--bg:#fff7e6;--card:#fff;--ink:#4a3b2a;--sel:#ffb703;--ok:#8ac926;--accent:#ff6b6b;--line:#e8d5b5;--soft:#f3e6cc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{overscroll-behavior:none;touch-action:manipulation}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum',sans-serif}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(255,247,230,.5),rgba(255,247,230,.5)),url(img/bg.jpg) center bottom/cover}
.hj{font-family:'LXGW WenKai TC','Noto Serif KR',serif;font-weight:700}
#app{max-width:960px;min-height:100dvh;margin:0 auto;padding:12px 16px 32px;display:flex;flex-direction:column;align-items:center;gap:18px}
#app>header+*{margin-top:auto}
#app>:last-child{margin-bottom:auto}
#app>*:not(header){max-width:var(--w)}
header{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:24px;gap:8px}
button{font-family:'Gowun Dodum',sans-serif;font-size:26px;padding:12px 28px;border:0;border-radius:999px;background:var(--accent);color:#fff;box-shadow:0 5px 0 #c94f4f;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #c94f4f}
button.soft{background:var(--soft);color:var(--ink);box-shadow:0 5px 0 var(--line)}
button.icon{padding:8px 14px;font-size:24px}
.big-btn{font-size:36px;padding:20px 48px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.title{font-size:var(--t-title);text-align:center;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.sub{font-size:var(--t-sub);opacity:.8;text-align:center}
.stage{width:100%;background:#fff;border-radius:24px;padding:12px 16px;box-shadow:0 4px 0 var(--line)}
.stage h3{margin:0 0 8px;font-weight:normal;font-size:22px}
.track{display:flex;flex-wrap:wrap;gap:10px}
.stn{width:72px;height:72px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;background:var(--soft);border:4px solid var(--line);cursor:pointer}
.stn small{font-size:11px;font-family:'Gowun Dodum',sans-serif}
.stn.done{background:#eaf7d9;border-color:var(--ok)}
.stn.gold{border-color:#f4c430;box-shadow:0 0 0 3px #ffe9a8}
.stn.cur{background:#fff;border-color:var(--accent);animation:pulse 1.2s infinite}
.stn.lock{opacity:.45;cursor:default}
@keyframes pulse{50%{transform:scale(1.08)}}
.grid{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:16px;width:100%;max-width:calc(var(--n,3)*210px)}
.card{background:var(--card);border-radius:22px;box-shadow:0 6px 0 var(--line);border:5px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;--ch:var(--card-h);height:var(--ch);padding:8px;font-size:clamp(48px,7vw,84px);line-height:1.15;cursor:pointer;text-align:center;transition:transform .15s}
.card.txt{font-size:clamp(22px,4vw,36px);word-break:keep-all;font-family:'Gowun Dodum',sans-serif}
.card small{font-size:clamp(14px,2.4vw,22px);font-family:'Gowun Dodum',sans-serif;min-height:1.2em}
.card.sel{border-color:var(--sel);transform:translateY(-6px)}
.card.ok{background:#eaf7d9;box-shadow:0 6px 0 #b9dc8f;pointer-events:none}
.card.dim{opacity:.35;pointer-events:none}
/* 풍선 터뜨리기 */
.sky{position:relative;width:100%;height:60vh;overflow:hidden;border-radius:24px;background:linear-gradient(#cfeaff,#fff7e6);touch-action:none}
.balloon{position:absolute;bottom:-140px;width:96px;height:116px;border-radius:50% 50% 48% 48%/58% 58% 42% 42%;display:flex;align-items:center;justify-content:center;font-size:52px;color:#fff;cursor:pointer;animation:rise 7s linear forwards;box-shadow:inset -10px -12px 0 rgba(0,0,0,.12);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.balloon::after{content:'';position:absolute;top:100%;left:50%;width:2px;height:40px;background:#999}
@keyframes rise{to{transform:translateY(calc(-60vh - 220px))}}
.balloon.pop{animation-play-state:paused;opacity:0;transition:opacity .3s}
#BT .hj{font-size:56px;vertical-align:middle}
.balloon.no{filter:grayscale(1);opacity:.6}
/* 별 쏘기 */
.shoot{height:62vh}
.cloud{position:absolute;width:124px;height:86px;background:#fff;border-radius:50px;display:flex;align-items:center;justify-content:center;font-size:54px;box-shadow:0 6px 0 #dbe7f2;animation:drift 4s ease-in-out infinite alternate;cursor:pointer}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
.cloud.hit{animation:none;transform:scale(1.5);opacity:0;transition:.35s}
.cloud.miss{filter:grayscale(1);opacity:.55}
.gun{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);transition:left .25s}
.gun img.pic{width:96px;height:96px}
.shot{position:absolute;top:calc(100% - 96px);font-size:44px;transform:translate(-50%,-50%);transition:top .35s ease-in;pointer-events:none}
#BT img.pic{width:56px;height:56px;vertical-align:middle}
/* 기차에 싣기 */
.train{display:flex;gap:14px;width:100%;justify-content:center;flex-wrap:wrap;padding-bottom:20px}
.car{width:150px;height:var(--card-h);background:#ffd36b;border-radius:16px 16px 8px 8px;border:4px solid #e2a93b;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
.car::before,.car::after{content:'';position:absolute;bottom:-20px;width:30px;height:30px;border-radius:50%;background:#555}
.car::before{left:14px}.car::after{right:14px}
.car img.pic{width:72px;height:72px}
.car .load{font-size:52px;min-height:1.1em;line-height:1}
.car.ok{background:#c9ef9f;border-color:var(--ok)}
#TL{touch-action:none}
.ghost{position:fixed;pointer-events:none;font-size:60px;transform:translate(-50%,-50%);z-index:9;opacity:.8}
/* 홈: 길어지는 기차 */
.mytrain{display:flex;gap:6px;overflow-x:auto;width:100%;padding:4px 0 18px;align-items:flex-end;justify-content:safe center}
.mytrain .c{flex:0 0 auto;width:64px;height:54px;border-radius:10px 10px 4px 4px;display:flex;align-items:center;justify-content:center;font-size:34px;border:3px solid rgba(0,0,0,.12);position:relative}
.mytrain .c::after{content:'● ●';position:absolute;bottom:-15px;left:0;right:0;text-align:center;font-size:12px;color:#555;letter-spacing:8px}
.mytrain .eng{flex:0 0 auto}.mytrain .eng img.pic{width:88px;height:88px}
.lines{position:relative;display:flex;justify-content:space-between;width:100%;max-width:640px;touch-action:none}
.lines .card{--ch:clamp(84px,14vh,124px)}
.lines .col{display:flex;flex-direction:column;gap:14px;width:36%}
.lines svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:1}
.lines line{stroke:var(--sel);stroke-width:8;stroke-linecap:round;stroke-dasharray:2 14}
.lines line.ok{stroke:var(--ok);stroke-dasharray:none}
.mem .face,.mem .up .back{display:none}
.mem .up .face{display:contents}
.mem{max-width:640px}
.mem .card.up{animation:flip .25s}
@keyframes flip{0%{transform:scaleX(0)}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
.prompt{font-size:clamp(70px,16vw,150px);line-height:1.1;text-align:center}
.prompt.sent{font-size:clamp(26px,5vw,40px);font-family:'Gowun Dodum',sans-serif;line-height:1.5;max-width:760px;word-break:keep-all}
.blank{display:inline-block;min-width:3.5em;border-bottom:4px solid var(--accent);margin:0 4px}
.prompt.txt{font-size:clamp(36px,8vw,64px);font-family:'Gowun Dodum',sans-serif}
b.k{color:var(--accent)}
.morph{position:relative;width:220px;height:220px}
.morph span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:170px}
/* 그림 1.3초 보여주고 → 2초에 걸쳐 한자로. 그림은 옅게 뒤에 남겨 모양을 비교 */
.morph .e{animation:out 3.3s ease-in-out forwards}
.morph .h{opacity:0;animation:in 3.3s ease-in-out forwards}
@keyframes out{0%,40%{opacity:1;transform:scale(1);filter:blur(0)}100%{opacity:.15;transform:scale(1);filter:blur(1px)}}
@keyframes in{0%,40%{opacity:0;transform:scale(1.3);filter:blur(10px)}100%{opacity:1;transform:none;filter:none}}
.words{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.words ruby{animation:pop .5s}.words rt{font-size:.55em;font-family:'Gowun Dodum',sans-serif;font-weight:400}
.words span{background:#fff;border-radius:18px;padding:10px 22px;font-size:34px;box-shadow:0 4px 0 var(--line)}
.slots{display:flex;gap:12px}
.slot{width:110px;height:110px;border-radius:20px;border:4px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:80px;background:#fff}
.bins{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:14px;width:100%}
.bin{background:#fff;border-radius:22px;box-shadow:0 6px 0 var(--line);padding:12px;text-align:center;font-size:26px;cursor:pointer;min-height:calc(var(--card-h) + 40px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.bin .e{font-size:56px}
.bin .got{font-size:20px;min-height:1.2em}
.sticker{font-size:150px;line-height:1;animation:pop .6s}
.title.hj{font-size:48px;letter-spacing:12px}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;width:100%}
.book div{background:#fff;border-radius:18px;padding:8px;text-align:center;box-shadow:0 4px 0 var(--line);font-size:16px}
.book div b{display:block;font-size:44px;font-weight:normal}
.book div.no{opacity:.35}
.book div.gold{box-shadow:0 0 0 4px #f4c430}
.panel{width:100%;background:#fff;border-radius:22px;padding:16px 22px;font-size:22px;box-shadow:0 4px 0 var(--line);line-height:1.6}
.panel table{width:100%;border-collapse:collapse}
.panel td{padding:4px 6px;border-bottom:1px solid var(--soft)}
.bar{height:12px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
img.pic{width:1em;height:1em;object-fit:contain}
.card img.pic{height:calc(var(--ch)*.7);width:auto;aspect-ratio:1}
.card:has(small:not(:empty)) img.pic{height:calc(var(--ch)*.48)}
.prompt img.pic{width:1.2em;height:1.2em}
.row .soft{font-size:20px;padding:10px 16px}
.row:has(.big-btn) .soft{font-size:28px;padding:18px 34px}
.morph img.pic{width:190px;height:190px}
.sticker img.pic{width:170px;height:170px}
button img.pic{vertical-align:-4px}
</style>
</head>
<body>
<div id="app"></div>
<script>

function distractWords(h,n,pool){const ss=CH[h].words.map(syl);const out=new Set();
  for(const o of shuffle(pool)) if(o!==h) for(const w of CH[o].words){if(!ss.some(s=>plain(w).includes(s)))out.add(w)}
  return shuffle([...out]).slice(0,n)}

let AC=null;
function tone(freq,t0,dur,type='sine',vol=.18){const a=AC||(AC=new (window.AudioContext||window.webkitAudioContext)());
  const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.05)}

  <div class="mytrain" id="MT">${S.done.map((i,j)=>`<div class="c hj" style="background:hsl(${j*47%360} 70% 80%)">${GROUPS[i].chars[0]}</div>`).join('')}<div class="eng">${ico('train')}</div></div>
  <button class="big-btn" onclick="startSession(false)">${due||newOk?'오늘의 한자 ▶':'연습하기 ▶'}</button>
  <div class="sub">${info.join(' · ')||'오늘 할 일 끝! 연습은 언제든 OK'}</div>
  <div class="row"><button class="soft" onclick="detective()">${ico('find')} 동음 탐정</button><button class="soft" onclick="shootGame()">🎯 별 쏘기</button><button class="soft" onclick="lineGame()">✏️ 선 긋기</button><button class="soft" onclick="memory()">🃏 카드 뒤집기</button><button class="soft" onclick="book()">${ico('book')} 스티커북</button>${g&&!newOk?'<button class="soft" onclick="startSession(true)">➕ 새 역 하나 더</button>':''}</div>${map}`);
  $('MT').scrollLeft=1e5;
}
function stn(g){const done=S.done.includes(g.i),cur=nextGroup()===g;
  return `<div class="stn ${done?'done':''} ${done&&mastered(g)?'gold':''} ${cur?'cur':''} " onclick="${cur?'startSession(true)':`replay(${g.i})`}"><span class="hj">${g.chars[0]}</span><small>${g.name}</small></div>`}

// ponytail: 테스트 기간엔 모든 역이 열림. 출시 전 false로 → 지난 역이 모두 2칸 이상일 때 다음 역
const TEST=true;
const canOpen=g=>TEST||g.i===0||mastered(GROUPS[g.i-1]);
let SES=null;
function startSession(force){const g=nextGroup(),doNew=!!g&&canOpen(g)&&(S.lastNew!==today()||force);begin(doNew?g:null,doNew)}
function replay(i){begin(GROUPS[i],false)}
function begin(g,isNew){const set=g?[...g.chars]:learned().slice(-4);if(!set.length)return goHome();
  SES={start:Date.now(),g,isNew,n:0,set};run(day(true))}
function again(){SES.n++;run(day(false))}
// 하루 = 소개 → 학습 → 복습 → 놀이. 오늘 글자가 네 단계 모두에 나오고, 지난 역 1자를 섞음
const LEARN=[c=>[()=>match(c)],c=>shuffle(c).map(h=>()=>soundPick(h,null)),c=>[()=>trainLoad(c)]];
const PLAY=[c=>[()=>memory(c)],c=>[()=>balloon(c)],c=>[()=>shooter(c)]];
function day(first){const {g,isNew,set}=SES,st=[],pv=g&&g.i>0?GROUPS[g.i-1].chars.filter(h=>S.cards[h]):[],prev=pv.length?pick(pv):null,mix=prev?[...set,prev]:set;
  if(first&&g){st.push(()=>banner(`${ico('station')} ${g.name} 역`,`새 글자 ${g.chars.length}개를 만나요!`));g.chars.forEach(h=>st.push(()=>intro(h)));st.push(()=>{g.chars.forEach(learnInit);save();NEXT()})}
  st.push(...LEARN[SES.n%LEARN.length](mix));
  if(g)shuffle(set).forEach(h=>st.push(()=>(SES.n%2?meanPick:picPick)(h,null)));
  if(first){const old=reviewSet(set);if(old.length){st.push(()=>banner('🔁 복습','전에 배운 글자, 기억나?'));old.forEach(h=>st.push(()=>review(h,true)))}}
  st.push(...PLAY[SES.n%PLAY.length](mix));
  if(first&&isNew)st.push(()=>{if(!S.done.includes(g.i))S.done.push(g.i);S.lastNew=today();save();NEXT()});
  st.push(()=>finish(first&&isNew?g:null));
  return st}
// 복습 최대 5자: 날짜 된 글자 3(오래 밀린 것부터) + 이번 챕터 손님 1 + 다른 챕터 손님 1 (가장 오래 안 본 것)
function reviewSet(ex){const t=today(),L=learned().filter(h=>!ex.includes(h)),seen=h=>S.cards[h].seen??S.cards[h].due-1,ch=h=>GROUPS[CH[h].g].stage;
  const out=L.filter(h=>S.cards[h].due<=t).sort((a,b)=>S.cards[a].due-S.cards[b].due).slice(0,3);
  const cur=SES.g?SES.g.stage:L.length?ch(L.at(-1)):'',guest=f=>L.filter(h=>!out.includes(h)&&f(h)).sort((a,b)=>seen(a)-seen(b))[0];
  [guest(h=>ch(h)===cur),guest(h=>ch(h)!==cur)].forEach(h=>h&&out.push(h));return out}
function fill(r,n){const extra=shuffle(learned().filter(h=>!r.includes(h))).slice(0,Math.max(0,n-r.length));return [...r,...extra]}

function banner(t,s){view(bar()+`<div class="title" style="font-size:44px;margin-top:40px">${t}</div><div class="sub">${s}</div><button class="big-btn" onclick="NEXT()">시작 ▶</button>`);say(s)}

function intro(h){const c=CH[h],ws=shuffle(c.words).slice(0,2+(Math.random()<.5));
  view(bar(GROUPS[c.g].name)+`<div class="morph">${c.emoji?`<span class="e">${pic(c.emoji)}</span>`:''}<span class="h hj">${h}</span></div>
  <div class="title">${c.hun}</div><div class="words">${ws.map(w=>`<span>${mark(w)}</span>`).join('')}</div>
  <div class="row"><button class="soft" id="again">🔊 다시 듣기</button><button id="go">다음 ▶</button></div>`);
  // 단어를 읽는 순간 그 단어의 소리 글자(화)가 한자(火)로 변신, 위에 작은 한글을 남김
  const box=$app.querySelector('.words'),flip=i=>{const b=box.children[i]?.querySelector('b.k');if(!b||b.querySelector('ruby'))return;b.innerHTML=`<ruby class="hj">${h}<rt>${b.textContent}</rt></ruby>`};
  const talk=()=>sayList([c.hun,...ws.map(plain)],500,i=>i>0&&flip(i-1));
  setTimeout(()=>sfx('magic'),1300);setTimeout(talk,c.emoji?3000:800);
  setTimeout(()=>ws.forEach((_,i)=>flip(i)),(c.emoji?3000:800)+ws.length*2500+2500); // 음성 안 될 때 대비
  $('again').onclick=talk;$('go').onclick=NEXT}

// 그림 = 왼쪽, 한자 = 오른쪽. 끌어서 선 긋기, 또는 하나씩 톡톡 눌러도 이어짐
const label=(h,set)=>{const e=CH[h].emoji;return e&&set.filter(x=>CH[x].emoji===e).length===1?[pic(e),'']:[CH[h].hun,' txt']};
function match(chars){let left=chars.length,sel=null,drag=null;
  view(bar('짝 맞추기')+`<div class="title">그림과 한자를 선으로 이어요!</div><div class="lines" id="M"><svg id="L"></svg><div class="col" id="A"></div><div class="col" id="B"></div></div>`);
  const M=$('M'),L=$('L');
  const mk=(box,h,isH)=>{const [html,cls]=isH?[h,' hj']:label(h,chars);const c=el('div','card'+cls,html+'<small></small>');c.h=h;c.isH=isH;c.onpointerdown=e=>down(e,c);$(box).append(c)};
  shuffle(chars).forEach(h=>mk('A',h,false));shuffle(chars).forEach(h=>mk('B',h,true));
  const rel=(x,y)=>{const m=M.getBoundingClientRect();return [x-m.left,y-m.top]};
  const dot=c=>{const r=c.getBoundingClientRect();return rel(c.isH?r.left:r.right,r.top+r.height/2)};
  const line=(a,[x2,y2],cls='')=>{const [x1,y1]=dot(a),l=document.createElementNS('http://www.w3.org/2000/svg','line');
    Object.entries({x1,y1,x2,y2,class:cls}).forEach(([k,v])=>l.setAttribute(k,v));L.append(l);return l};
  function down(e,c){e.preventDefault();if(c.classList.contains('ok'))return;
    if(sel&&sel.isH!==c.isH)return check(sel,c);
    sel?.classList.remove('sel');sel=c;c.classList.add('sel');sfx('tap');
    drag?.remove();drag=line(c,rel(e.clientX,e.clientY));drag.c=c}
  onpointermove=e=>{if(!drag)return;const [x,y]=rel(e.clientX,e.clientY);drag.setAttribute('x2',x);drag.setAttribute('y2',y)};
  onpointerup=onpointercancel=e=>{if(!drag)return;const c=drag.c;drag.remove();drag=null;
    const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('.card');if(t&&t.isH!==undefined&&t.isH!==c.isH&&!t.classList.contains('ok'))check(c,t)};
  function check(a,c){sel=null;a.classList.remove('sel');
    if(a.h===c.h){sfx('ok');a.classList.add('ok');c.classList.add('ok');line(a.isH?c:a,dot(a.isH?a:c),'ok');(c.isH?c:a).querySelector('small').textContent=CH[c.h].hun;say(CH[c.h].hun);if(--left===0)setTimeout(NEXT,1400)}
    else{sfx('no');shakeEl(a);shakeEl(c);say('다시 찾아볼까?')}}}

function lineGame(){const L=learned();SES=null;run([()=>match(shuffle(L.length>=3?L:GROUPS[0].chars).slice(0,4)),()=>finish(null)])}

// 카드 뒤집기: 그림 카드와 한자 카드 짝 찾기 (자유 놀이, 채점 안 함)
// 카드 4쌍(8장)까지만 — 더 많으면 6살에겐 위치 기억이 너무 어려움. chars 주면 수업 중(끝나면 NEXT)
function memory(chars){const L=learned(),pool=shuffle(chars||(L.length>=3?L:GROUPS[0].chars)).slice(0,4);let open=[],left=pool.length,busy=false;
  view(bar('카드 뒤집기')+`<div class="title">그림과 한자 짝을 찾아요!</div><div class="grid mem" id="G" style="--n:4"></div><div id="end"></div>`);
  shuffle(pool.flatMap(h=>[[h,true],[h,false]])).forEach(([h,isH])=>{const [html,cls]=isH?[h,' hj']:label(h,pool);
    const c=el('div','card'+cls,`<span class="back">${ico('train')}</span><span class="face">${html}</span>`);c.h=h;c.isH=isH;c.onclick=()=>flip(c);$('G').append(c)});
  function flip(c){if(busy||c.classList.contains('up'))return;c.classList.add('up');sfx('tap');open.push(c);if(open.length<2)return;
    const [a,b]=open;open=[];
    if(a.h===b.h){sfx('ok');a.classList.add('ok');b.classList.add('ok');say(CH[a.h].hun);if(--left===0)end()}
    else{busy=true;setTimeout(()=>{a.classList.remove('up');b.classList.remove('up');busy=false},1100)}}
  function end(){setTimeout(()=>{sfx('win');say('다 찾았어!');if(chars)return setTimeout(NEXT,1500);$('end').innerHTML='<div class="row"><button onclick="memory()">한 번 더</button><button class="soft" onclick="goHome()">기차역으로</button></div>'},1200)}}

// 고르기 공용: 틀리면 그 보기를 흐리게 → 남은 것 중 다시 고르기
function choice(o){let first=true,done=false;
  view(bar(o.head)+`<div class="title">${o.title}${o.speak?'<button class="soft icon" id="spk">🔊</button>':''}</div><div class="prompt ${o.bigCls||''}">${o.big}</div><div class="grid" id="O" style="--n:${o.opts.length}"></div>`);
  if(o.speak){const s=()=>say(o.speak);$('spk').onclick=s;setTimeout(s,300)}
  shuffle(o.opts).forEach(op=>{const c=el('div','card '+(op.cls||''),op.html);
    c.onclick=()=>{if(done)return;
      if(op.ok){done=true;sfx('ok');c.classList.add('ok');if(op.after)c.innerHTML=op.after;if(o.bigCls==='sent')document.querySelector('.prompt').innerHTML=o.big.replace(/<span class="blank"><\/span>/,`<b class="k">${op.html}</b>`);say(o.okSay||pick(PRAISE));o.onAnswer&&o.onAnswer(first);setTimeout(NEXT,1500)}
      else{first=false;sfx('no');shakeEl(c);c.classList.add('dim');say('다시 찾아볼까?')}};
    $('O').append(c)})}
function others(h,n){const L=learned().filter(x=>x!==h);return shuffle(L.length>=n?L:Object.keys(CH).filter(x=>x!==h)).slice(0,n)}
// 칸에 따라 활동이 어려워짐: 0~1 그림·소리로 한자 고르기 → 2 한자 보고 뜻 → 3 단어 → 4 문장·레고
function review(h,graded){const b=S.cards[h]?.box||0,on=graded?ok=>grade(h,ok):null,cb=COMBO.find(x=>x[0].includes(h)&&comboReady(x));
  if(b<=1)return pick([picPick,pickHanja])(h,on);
  if(b===2)return meanPick(h,on);
  if(b===3)return pick([pickWord,basket])(h,on);
  if(cb&&Math.random()<.3){on&&on(true);return lego(cb)}
  return pick(SENT[h]?[cloze,guess,pickWord]:[guess,pickWord])(h,on)}
function picPick(h,on){const c=CH[h];
  choice({head:'그림 보고 고르기',title:'이 그림은 어떤 한자일까?',big:c.emoji?pic(c.emoji):c.hun,bigCls:c.emoji?'':'txt',speak:c.hun,opts:[{html:h,cls:'hj',ok:true},...others(h,2).map(x=>({html:x,cls:'hj'}))],onAnswer:on,okSay:c.hun})}
// 소리만 듣고 고르기 (글자 힌트 없음)
function soundPick(h,on){const c=CH[h];
  choice({head:'소리 듣고 고르기',title:'잘 듣고 한자를 골라요',big:'👂',bigCls:'txt',speak:c.hun,opts:[{html:h,cls:'hj',ok:true},...others(h,2).map(x=>({html:x,cls:'hj'}))],onAnswer:on,okSay:c.hun})}
// 처음 보는 한자어 뜻 맞히기: 아는 글자로 된 단어 → 뜻 3개 중 고르기
function guess(h,on){const ready=COMBO.filter(x=>x[0].includes(h)&&comboReady(x));if(!ready.length)return pickWord(h,on);
  const [hz,rd,mean]=pick(ready),ds=shuffle(COMBO.filter(x=>x[2]!==mean)).slice(0,2).map(x=>x[2]);
  choice({head:'뜻 맞히기',title:'🔍 무슨 뜻일까?',big:`<span class="hj">${hz}</span><br><small>${rd}</small>`,bigCls:'txt',speak:rd,opts:[{html:mean,cls:'txt',ok:true},...ds.map(d=>({html:d,cls:'txt'}))],onAnswer:on,okSay:`${rd}, ${mean}`})}
// 단어 가족 바구니: 두 글자 바구니에 한자어 나눠 담기 (소리가 같은 글자끼리는 짝짓지 않음)
function basket(h,on){const ss=CH[h].words.map(syl),o=pick(learned().filter(x=>x!==h&&CH[x].words.length>=2&&!CH[x].words.some(w=>ss.includes(syl(w)))));if(!o)return pickWord(h,on);
  const items=shuffle([...shuffle(CH[h].words).slice(0,2).map(w=>({w,h})),...shuffle(CH[o].words).slice(0,2).map(w=>({w,h:o}))]);let k=0,first=true,busy=false;
  view(bar('단어 바구니')+`<div class="title">어느 바구니에 들어갈까?</div><div class="prompt txt" id="W"></div><div class="bins" style="--n:2">${shuffle([h,o]).map(x=>`<div class="bin" data-h="${x}"><span class="e hj">${x}</span>${CH[x].hun}<span class="got"></span></div>`).join('')}</div>`);
  const show=()=>{if(k>=items.length){on&&on(first);sfx('win');return setTimeout(NEXT,1200)}$('W').innerHTML=mark(items[k].w);say(plain(items[k].w));busy=false};
  document.querySelectorAll('.bin').forEach(b=>b.onclick=()=>{if(busy||k>=items.length)return;
    if(b.dataset.h===items[k].h){busy=true;sfx('ok');const g=b.querySelector('.got');g.textContent+=(g.textContent?' · ':'')+plain(items[k].w);k++;setTimeout(show,900)}
    else{first=false;sfx('no');shakeEl(b);say('다른 바구니일까?')}});
  show()}
// 기차에 싣기: 그림 칸에 맞는 한자를 끌어다(또는 눌러서) 싣기
function trainLoad(chars){let left=chars.length,sel=null,gh=null;
  view(bar('기차에 싣기')+`<div class="title">그림 칸에 맞는 한자를 실어요!</div><div class="train" id="TR"></div><div class="grid" id="TL" style="--n:${chars.length}"></div>`);
  say('그림 칸에 맞는 한자를 실어요');
  shuffle(chars).forEach(h=>{const [html,cls]=label(h,chars),c=el('div','car'+cls,`<span class="load hj"></span>${html}`);c.h=h;c.onclick=()=>sel&&drop(sel,c);$('TR').append(c)});
  shuffle(chars).forEach(h=>{const t=el('div','card hj',h);t.h=h;
    t.onpointerdown=e=>{e.preventDefault();if(t.classList.contains('ok'))return;sel?.classList.remove('sel');sel=t;t.classList.add('sel');sfx('tap');
      gh=el('div','ghost hj',h);gh.style.left=e.clientX+'px';gh.style.top=e.clientY+'px';document.body.append(gh)};$('TL').append(t)});
  onpointermove=e=>{if(gh){gh.style.left=e.clientX+'px';gh.style.top=e.clientY+'px'}};
  onpointerup=onpointercancel=e=>{if(!gh)return;gh.remove();gh=null;const c=document.elementFromPoint(e.clientX,e.clientY)?.closest('.car');if(c&&sel)drop(sel,c)};
  function drop(t,c){if(c.classList.contains('ok'))return;
    if(t.h===c.h){sfx('ok');c.classList.add('ok');c.querySelector('.load').textContent=t.h;t.classList.add('ok');t.classList.remove('sel');sel=null;say(CH[t.h].hun);if(--left===0)setTimeout(()=>{sfx('win');NEXT()},1400)}
    else{sfx('no');shakeEl(c);say('다른 칸일까?')}}}
// 별 쏘기: 구름을 누르면 기차가 그 밑으로 가서 별을 쏨. 말해 준 한자 구름만 맞히기 (조준 필요 없음)
function shooter(chars){const tg=shuffle([...chars,...chars]).slice(0,6);let k=0,busy=false,score=0;
  view(bar('별 쏘기')+`<div class="title" id="BT"></div><div class="sky shoot" id="SK"><div class="gun" id="GN">${ico('train')}</div></div>`);
  const sk=$('SK');
  const fill=()=>{sk.querySelectorAll('.cloud').forEach(c=>c.remove());
    shuffle([...chars,...shuffle(chars)].slice(0,6)).forEach((h,i)=>{const c=el('div','cloud hj',h);c.h=h;
      c.style.top=(6+(i%3)*21)+'%';c.style.left=(6+Math.floor(i/3)*44+Math.random()*22)+'%';c.style.animationDelay=(-Math.random()*4)+'s';
      c.onpointerdown=()=>shoot(c);sk.append(c)})};
  const ask=()=>{const c=CH[tg[k]];$('BT').innerHTML=`${c.emoji?pic(c.emoji):''}<span>${c.hun}</span> 맞혀요! <small>⭐ ${score}</small>`;say(`${c.hun}, 맞혀!`)};
  function shoot(c){if(busy||c.classList.contains('hit'))return;busy=true;
    const r=c.getBoundingClientRect(),b=sk.getBoundingClientRect(),x=r.left+r.width/2-b.left;
    $('GN').style.left=x+'px';const st=el('div','shot','⭐');st.style.left=x+'px';sk.append(st);sfx('tap');
    requestAnimationFrame(()=>requestAnimationFrame(()=>{st.style.top=(r.top+r.height/2-b.top)+'px'}));
    setTimeout(()=>{st.remove();
      if(c.h===tg[k]){sfx('pop');score++;c.classList.add('hit');setTimeout(()=>c.remove(),400);
        if(++k>=tg.length){$('BT').innerHTML=`🎉 다 맞혔어! <small>⭐ ${score}</small>`;sfx('win');say('다 맞혔어!');return setTimeout(NEXT,1600)}
        setTimeout(()=>{if(![...sk.querySelectorAll('.cloud:not(.hit)')].some(x=>x.h===tg[k]))fill();ask();busy=false},500)}
      else{sfx('no');c.classList.add('miss');setTimeout(()=>c.classList.remove('miss'),900);busy=false}},380)}
  fill();ask()}
function shootGame(){const L=learned();SES=null;run([()=>shooter(shuffle(L.length>=3?L:GROUPS[0].chars).slice(0,4)),()=>finish(null)])}
// 풍선 터뜨리기: 말해 주는 한자 풍선만 터뜨리기. 글자마다 두 번
function balloon(chars){const tg=shuffle([...chars,...chars]).slice(0,6);let k=0,n=0,alive=true;
  view(bar('풍선 터뜨리기')+`<div class="title" id="BT"></div><div class="sky" id="SK"></div>`);
  const ask=()=>{const h=tg[k];$('BT').innerHTML=`<span class="hj">${h}</span> 풍선을 터뜨려요! <small>${k+1}/${tg.length}</small>`;say(`${CH[h].hun}, 터뜨려!`)};
  const spawn=()=>{const sk=$('SK');if(!alive||!sk)return;n++;const h=n%3===1?tg[k]:pick(chars),b=el('div','balloon hj',h);
    b.style.left=(4+Math.random()*72)+'%';b.style.background=`hsl(${Math.random()*360|0} 72% 60%)`;
    b.onpointerdown=()=>{if(b.classList.contains('pop')||!alive)return;
      if(h===tg[k]){sfx('pop');b.classList.add('pop');setTimeout(()=>b.remove(),300);
        if(++k>=tg.length){alive=false;sfx('win');say('다 터뜨렸어!');setTimeout(NEXT,1500)}else setTimeout(ask,400)}
      else{sfx('no');b.classList.add('no')}};
    b.onanimationend=()=>b.remove();sk.append(b);setTimeout(spawn,1100)};
  ask();spawn()}
function meanPick(h,on){const set=[h,...others(h,2)];
  choice({head:'뜻 고르기',title:'이 한자는 무슨 뜻일까?',big:h,bigCls:'hj',opts:set.map(x=>{const [html,cls]=label(x,set);return {html,cls:cls.trim(),ok:x===h,after:html+`<small>${CH[x].hun}</small>`}}),onAnswer:on,okSay:CH[h].hun})}
function pickHanja(h,on){const c=CH[h];
  choice({head:'글자 찾기',title:'이 글자를 찾아봐!',big:c.hun,bigCls:'txt',speak:c.hun,opts:[{html:h,cls:'hj',ok:true},...others(h,2).map(x=>({html:x,cls:'hj'}))],onAnswer:on})}
function pickWord(h,on){const c=CH[h],right=pick(c.words),L=learned().filter(x=>x!==h);
  const ds=distractWords(h,2,L.length>=3?L:Object.keys(CH));
  choice({head:'단어 찾기',title:'이 글자가 들어간 말은?',big:h,bigCls:'hj',opts:[{html:plain(right),cls:'txt',ok:true,after:mark(right)+`<small>${c.hun}</small>`},...ds.map(w=>({html:plain(w),cls:'txt'}))],onAnswer:on,okSay:`${plain(right)}! ${c.hun}`})}
function cloze(h,on){const s=SENT[h],w=s.match(/\{(.+?)\}/)[1],full=s.replace(/[{}]/g,'');
  const L=learned().filter(x=>x!==h),ds=distractWords(h,2,L.length>=3?L:Object.keys(CH)).map(plain).filter(d=>d!==w);
  choice({head:'문장 속 한자어',title:'📖 빈칸에 들어갈 말은?',big:s.replace(/\{.+?\}/,'<span class="blank"></span>'),bigCls:'sent',speak:null,
    opts:[{html:w,cls:'txt',ok:true,after:`${w}<small>${CH[h].hun}</small>`},...ds.map(d=>({html:d,cls:'txt'}))],
    onAnswer:on,okSay:full})}
function similar(s){const t=pick([...s]);
  choice({head:'닮은꼴 찾기',title:'👀 닮은꼴! 어느 것일까?',big:CH[t].hun,bigCls:'txt',speak:CH[t].hun,opts:[...s].map(x=>({html:x,cls:'hj',ok:x===t})),okSay:CH[t].hun})}

function lego([hz,rd,hint]){const need=[...hz];let k=0;
  const extra=shuffle(learned().filter(x=>!need.includes(x))).slice(0,2),tiles=shuffle([...need,...extra]);
  view(bar('한자 레고')+`<div class="title" id="lt">🧱 글자를 합쳐서 「${rd}」 만들기!</div><div class="sub">${hint}</div>
  <div class="slots">${need.map((_,i)=>`<div class="slot hj" id="s${i}"></div>`).join('')}</div><div class="grid" id="T" style="--n:${tiles.length}"></div>`);
  say(`${rd}, 만들어 볼까?`);
  tiles.forEach(x=>{const t=el('div','card hj',x+`<small>${CH[x].hun}</small>`);
    t.onclick=()=>{if(k>=need.length)return;
      if(x===need[k]){sfx('pop');$('s'+k).textContent=x;t.classList.add('ok');say(CH[x].hun);
        if(++k===need.length)setTimeout(()=>{sfx('magic');$('lt').innerHTML=`🎉 <span class="hj">${hz}</span> = ${rd}`;say(`${rd}! ${hint}`);setTimeout(NEXT,2400)},700)}
      else{sfx('no');shakeEl(t);say('다른 글자일까?')}};
    $('T').append(t)})}

// 10분 안이면 "한 번 더", 넘으면 "오늘은 여기까지"
function finish(g){const more=SES&&Date.now()-SES.start<6e5,
  btns=`<div class="row">${more?'<button class="big-btn" onclick="again()">한 번 더 🔁</button>':''}<button class="${more?'soft':'big-btn'}" onclick="goHome()">기차역으로 🚂</button></div>`;
  if(g){const m=g.mission;
    view(bar()+`<div class="title">스티커를 받았어!</div><div class="sticker">${pic(firstEmoji(g))}</div><div class="title hj">${g.chars.join(' ')}</div>
    <div class="panel" style="text-align:center">🔎 오늘의 미션<br>${m}</div>${btns}`);
    sfx('win');sayList(['스티커를 받았어!','오늘의 미션',m])}
  else{const t=more||!SES?'잘했어! 🎉':'오늘은 여기까지! 내일 또 만나요 👋';
    view(bar()+`<div class="title">${t}</div><div class="sticker">${ico('trophy')}</div>${btns}`);sfx('win');say(t.replace(/[🎉👋]/gu,''))}}

function detective(){const set=pick(HOMO),items=shuffle(set.bins.flatMap((b,bi)=>b[3].map(w=>({w,bi})))).slice(0,6);let k=0,busy=false;
  view(bar('동음 탐정')+`<div class="title">🔍 「${set.s}」는 다 같은 「${set.s}」일까?</div><div class="prompt txt" id="W"></div>
  <div class="bins" style="--n:${set.bins.length}">${set.bins.map((b,i)=>`<div class="bin" id="b${i}"><span class="e">${b[1]}</span>${b[2]}<span class="got"></span></div>`).join('')}</div><div id="end"></div>`);
  const show=()=>{if(k>=items.length)return end();$('W').innerHTML=items[k].w.replace(set.s,`<b class="k">${set.s}</b>`);say(items[k].w);busy=false};
  set.bins.forEach((b,i)=>$('b'+i).onclick=e=>{if(busy||k>=items.length)return;const x=e.currentTarget;
    if(items[k].bi===i){busy=true;sfx('ok');const got=x.querySelector('.got');got.textContent+=(got.textContent?' · ':'')+items[k].w;say(`맞아! ${items[k].w}의 ${set.s}는 ${b[2]}`);k++;setTimeout(show,1800)}
    else{sfx('no');shakeEl(x);say('음, 다른 뜻일까?')}});
  function end(){sfx('win');$('W').textContent='🎉 소리는 같아도 글자는 달라요!';set.bins.forEach((b,i)=>$('b'+i).querySelector('.e').innerHTML=`<span class="hj">${b[0]}</span>`);
    say('소리는 같아도 글자는 달라요!');$('end').innerHTML='<div class="row"><button onclick="detective()">한 번 더</button><button class="soft" onclick="goHome()">기차역으로</button></div>'}
  show()}

function book(){view(bar('스티커북')+`<div class="book">${GROUPS.map(g=>{const d=S.done.includes(g.i);
  return `<div class="${d?(mastered(g)?'gold':''):'no'}"><b>${d?pic(firstEmoji(g)):'❔'}</b><span class="hj">${d?g.chars.join(''):''}</span><br>${g.name}</div>`}).join('')}</div><div class="sub">⭐ 금테두리 = 복습까지 완벽!</div>`)}

function parentView(){const t=today();
  const rows=STAGES.map(([s,lab])=>{const gs=GROUPS.filter(g=>g.stage===s),d=gs.filter(g=>S.done.includes(g.i)),m=d.filter(mastered).length;
    return `<tr><td>${lab}</td><td style="width:45%"><div class="bar"><i style="width:${d.length/gs.length*100}%"></i></div></td><td>${d.length}/${gs.length}역 · 완벽 ${m}</td></tr>`}).join('');
  const weak=learned().filter(h=>S.cards[h].wrong).sort((a,b)=>S.cards[b].wrong-S.cards[a].wrong).slice(0,8);
  view(bar('부모 화면')+`<div class="panel"><table>${rows}</table></div>
  <div class="panel">만난 한자어 <b>${new Set(learned().flatMap(h=>CH[h].words.map(plain))).size}</b>개 (전체 ${new Set(Object.values(CH).flatMap(c=>c.words.map(plain))).size}) · 배운 글자 ${learned().length}/${Object.keys(CH).length} · 오늘 복습 ${learned().filter(h=>S.cards[h].due<=t).length}개<br>자주 틀린 글자: <span class="hj">${weak.map(h=>`${h}(${S.cards[h].wrong})`).join(' ')||'없음'}</span></div>
  <div class="panel">하루 새 역 1개가 기본. 더 하려면 홈의 「➕ 새 역 하나 더」.<br>복습 간격: 글자마다 사다리 0~4칸, 1·1·2·4·7일. 맞히면 한 칸 위, 틀리면 한 칸 아래.<br>역 금테두리 = 모든 글자를 복습에서 두 번 이상 맞힘.</div>
  <div class="row"><button class="soft" onclick="S.off++;save();parentView()">⏩ 하루 지나기 (테스트)</button><button class="soft" id="rs">처음부터 다시</button></div>`);
  const rs=$('rs');rs.onclick=()=>{if(rs.dataset.k){S=fresh();save();goHome()}else{rs.dataset.k=1;rs.textContent='정말요? 한 번 더 누르면 지워져요'}}}

load();goHome();
</script>
