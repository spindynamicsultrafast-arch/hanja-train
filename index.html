<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="darkreader-lock">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>한자 기차여행</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7e6;--card:#fff;--ink:#4a3b2a;--sel:#ffb703;--ok:#8ac926;--accent:#ff6b6b;--line:#e8d5b5;--soft:#f3e6cc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Jua,sans-serif}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(255,247,230,.5),rgba(255,247,230,.5)),url(img/bg.jpg) center bottom/cover}
.hj{font-family:'Noto Serif KR',serif}
#app{max-width:960px;margin:0 auto;padding:12px 16px 40px;display:flex;flex-direction:column;align-items:center;gap:16px}
header{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:28px;gap:8px}
button{font-family:Jua,sans-serif;font-size:26px;padding:12px 28px;border:0;border-radius:999px;background:var(--accent);color:#fff;box-shadow:0 5px 0 #c94f4f;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #c94f4f}
button.soft{background:var(--soft);color:var(--ink);box-shadow:0 5px 0 var(--line)}
button.icon{padding:8px 14px;font-size:24px}
.big-btn{font-size:36px;padding:20px 48px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.title{font-size:32px;text-align:center}
.sub{font-size:22px;opacity:.8;text-align:center}
.stage{width:100%;background:#fff;border-radius:24px;padding:12px 16px;box-shadow:0 4px 0 var(--line)}
.stage h3{margin:0 0 8px;font-weight:normal;font-size:22px}
.track{display:flex;flex-wrap:wrap;gap:10px}
.stn{width:72px;height:72px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;background:var(--soft);border:4px solid var(--line);cursor:pointer}
.stn small{font-size:11px;font-family:Jua,sans-serif}
.stn.done{background:#eaf7d9;border-color:var(--ok)}
.stn.gold{border-color:#f4c430;box-shadow:0 0 0 3px #ffe9a8}
.stn.cur{background:#fff;border-color:var(--accent);animation:pulse 1.2s infinite}
.stn.lock{opacity:.45;cursor:default}
@keyframes pulse{50%{transform:scale(1.08)}}
.grid{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:14px;width:100%}
.card{background:var(--card);border-radius:22px;box-shadow:0 6px 0 var(--line);border:5px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:120px;padding:8px;font-size:clamp(40px,8vw,80px);line-height:1.15;cursor:pointer;text-align:center;transition:transform .15s}
.card.txt{font-size:clamp(22px,4vw,36px);word-break:keep-all;font-family:Jua,sans-serif}
.card small{font-size:clamp(14px,2.4vw,22px);font-family:Jua,sans-serif;min-height:1.2em}
.card.sel{border-color:var(--sel);transform:translateY(-6px)}
.card.ok{background:#eaf7d9;box-shadow:0 6px 0 #b9dc8f;pointer-events:none}
.card.dim{opacity:.35;pointer-events:none}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
.prompt{font-size:clamp(70px,16vw,150px);line-height:1.1;text-align:center}
.prompt.txt{font-size:clamp(36px,8vw,64px);font-family:Jua,sans-serif}
b.k{color:var(--accent)}
.morph{position:relative;width:220px;height:220px}
.morph span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:170px}
/* 그림 1.3초 보여주고 → 2초에 걸쳐 한자로. 그림은 옅게 뒤에 남겨 모양을 비교 */
.morph .e{animation:out 3.3s ease-in-out forwards}
.morph .h{opacity:0;animation:in 3.3s ease-in-out forwards}
@keyframes out{0%,40%{opacity:1;transform:scale(1);filter:blur(0)}100%{opacity:.15;transform:scale(1);filter:blur(1px)}}
@keyframes in{0%,40%{opacity:0;transform:scale(1.3);filter:blur(10px)}100%{opacity:1;transform:none;filter:none}}
.words{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.words span{background:#fff;border-radius:16px;padding:8px 16px;font-size:28px;box-shadow:0 4px 0 var(--line)}
.slots{display:flex;gap:12px}
.slot{width:110px;height:110px;border-radius:20px;border:4px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:80px;background:#fff}
.bins{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:14px;width:100%}
.bin{background:#fff;border-radius:24px;box-shadow:0 6px 0 var(--line);padding:12px;text-align:center;font-size:26px;cursor:pointer;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.bin .e{font-size:56px}
.bin .got{font-size:18px;min-height:1.2em}
.sticker{font-size:150px;animation:pop .6s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;width:100%}
.book div{background:#fff;border-radius:18px;padding:8px;text-align:center;box-shadow:0 4px 0 var(--line);font-size:16px}
.book div b{display:block;font-size:44px;font-weight:normal}
.book div.no{opacity:.35}
.book div.gold{box-shadow:0 0 0 4px #f4c430}
.panel{width:100%;background:#fff;border-radius:24px;padding:16px 20px;font-size:20px;box-shadow:0 4px 0 var(--line);line-height:1.6}
.panel table{width:100%;border-collapse:collapse}
.panel td{padding:4px 6px;border-bottom:1px solid var(--soft)}
.bar{height:12px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
img.pic{width:1em;height:1em;object-fit:contain}
.card img.pic{width:min(110px,75%);height:auto;aspect-ratio:1}
.morph img.pic{width:190px;height:190px}
.sticker img.pic{width:170px;height:170px}
button img.pic{vertical-align:-4px}
</style>
</head>

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const plain=w=>w.replace(/[\[\]]/g,'');
const mark=w=>w.replace(/\[(.+?)\]/g,'<b class="k">$1</b>');
const syl=w=>(w.match(/\[(.+?)\]/)||[])[1];

function distractWords(h,n,pool){const ss=CH[h].words.map(syl);const out=new Set();
  for(const o of shuffle(pool)) if(o!==h) for(const w of CH[o].words){if(!ss.some(s=>plain(w).includes(s)))out.add(w)}
  return shuffle([...out]).slice(0,n)}

// 가장 또렷한 한국어 음성 고르기: Google(Chrome·안드로이드) > 자연어(Edge) > Yuna(아이패드) > 기본
function pickVoice(){const vs=speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang));
  const rank=v=>/google/i.test(v.name)?0:/natural|online/i.test(v.name)?1:/yuna|sora|premium|enhanced/i.test(v.name)?2:/heami/i.test(v.name)?9:5;
  VOICE=vs.sort((a,b)=>rank(a)-rank(b))[0]||null}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function sayList(parts,gap=500){const id=++SAYID;let i=0;
  try{speechSynthesis.cancel()}catch(e){}
  BGM.volume=.05;
  const next=()=>{if(id!==SAYID)return;if(i>=parts.length){BGM.volume=.16;return}
    try{UTT=new SpeechSynthesisUtterance(parts[i++]);UTT.lang='ko-KR';if(VOICE)UTT.voice=VOICE;UTT.rate=.9;UTT.onend=()=>setTimeout(next,gap);speechSynthesis.speak(UTT)}catch(e){BGM.volume=.16}};
  setTimeout(next,150)}

let AC=null;
function tone(freq,t0,dur,type='sine',vol=.18){const a=AC||(AC=new (window.AudioContext||window.webkitAudioContext)());
  const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.05)}
const SFX={
  tap:()=>tone(660,0,.08,'triangle',.12),
  ok:()=>{tone(784,0,.15,'triangle');tone(1175,.1,.25,'triangle')},
  no:()=>{tone(220,0,.18,'sine',.15);tone(196,.12,.22,'sine',.12)},
  pop:()=>{tone(523,0,.1,'square',.06);tone(1047,.06,.18,'triangle',.15)},
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,i===3?.6:.2,'triangle',.16)),
  magic:()=>[1319,1568,1760,2093].forEach((f,i)=>tone(f,i*.07,.25,'sine',.07)),
};

let Q=[],K=0;
function run(steps){Q=steps;K=0;NEXT()}

function goHome(){
  const t=today(),due=learned().filter(h=>S.cards[h].due<=t).length,g=nextGroup(),newOk=g&&S.lastNew!==t;
  const info=[];if(due)info.push(`복습 ${due}개`);if(newOk)info.push(`새 역: ${g.name}`);if(!g)info.push('모든 역 도착! 🏆');
  const map=['1A','1B','2','3','4','5'].map(st=>`<div class="stage"><h3>${st}단계</h3><div class="track">${GROUPS.filter(x=>x.stage===st).map(stn).join('')}</div></div>`).join('');
  view(`<header><span>${ico('train')} 한자 기차여행</span><span>${ico('star')} ${S.done.length}/${GROUPS.length}</span><span><button class="soft icon" onclick="toggleMusic()">${musicOn()?'🎵':'🔇'}</button> <button class="soft icon" onclick="parentView()">⚙</button></span></header>
  <button class="big-btn" onclick="startSession(false)">${due||newOk?'오늘의 한자 ▶':'연습하기 ▶'}</button>
  <div class="sub">${info.join(' · ')||'오늘 할 일 끝! 연습은 언제든 OK'}</div>
  <div class="row"><button class="soft" onclick="detective()">${ico('find')} 동음 탐정</button><button class="soft" onclick="book()">${ico('book')} 스티커북</button>${g&&!newOk?'<button class="soft" onclick="startSession(true)">➕ 새 역 하나 더</button>':''}</div>${map}`);
}
function stn(g){const done=S.done.includes(g.i),cur=nextGroup()===g;
  return `<div class="stn ${done?'done':''} ${done&&mastered(g)?'gold':''} ${cur?'cur':''} ${!done&&!cur?'lock':''}" ${done?`onclick="replay(${g.i})"`:cur?'onclick="startSession(true)"':''}><span class="hj">${done||cur?g.chars[0]:'🔒'}</span><small>${g.name}</small></div>`}

function startSession(force){
  const t=today(),due=shuffle(learned().filter(h=>S.cards[h].due<=t)).slice(0,6),g=nextGroup(),doNew=!!g&&(S.lastNew!==t||force),st=[];
  if(due.length){st.push(()=>banner('🔁 복습 시간','전에 배운 글자, 기억나?'));due.forEach(h=>st.push(()=>review(h,true)))}
  if(doNew)st.push(...lesson(g,true));
  if(!due.length&&!doNew){const L=shuffle(learned()).slice(0,5);if(!L.length)return goHome();st.push(()=>banner('💪 연습','배운 글자로 연습해요!'));L.forEach(h=>st.push(()=>review(h,false)))}
  st.push(()=>finish(doNew?g:null,false));
  run(st);
}
function replay(i){run([...lesson(GROUPS[i],false),()=>finish(null,true)])}

function lesson(g,isNew){
  const st=[()=>banner(`${ico('station')} ${g.name} 역`,`새 글자 ${g.chars.length}개를 만나요!`)];
  g.chars.forEach(h=>st.push(()=>intro(h)));
  st.push(()=>{g.chars.forEach(learnInit);save();NEXT()});
  const c=g.chars,half=Math.ceil(c.length/2);
  (c.length>4?[c.slice(0,half),c.slice(half)]:[c]).forEach(r=>st.push(()=>match(fill(r,3))));
  c.forEach(h=>st.push(()=>pickWord(h,null)));
  st.push(()=>{const set=new Set(c);
    const cs=shuffle(COMBO.filter(x=>[...x[0]].some(h=>set.has(h))&&comboReady(x))).slice(0,2);
    const sm=SIM.filter(s=>[...s].some(h=>set.has(h))&&[...s].every(h=>S.cards[h])).slice(0,2);
    insert([...cs.map(x=>()=>lego(x)),...sm.map(s=>()=>similar(s))])});
  if(isNew)st.push(()=>{if(!S.done.includes(g.i))S.done.push(g.i);S.lastNew=today();save();NEXT()});
  return st;
}
function fill(r,n){const extra=shuffle(learned().filter(h=>!r.includes(h))).slice(0,Math.max(0,n-r.length));return [...r,...extra]}

function banner(t,s){view(bar()+`<div class="title" style="font-size:44px;margin-top:40px">${t}</div><div class="sub">${s}</div><button class="big-btn" onclick="NEXT()">시작 ▶</button>`);say(s)}

function intro(h){const c=CH[h];
  view(bar(GROUPS[c.g].name)+`<div class="morph">${c.emoji?`<span class="e">${pic(c.emoji)}</span>`:''}<span class="h hj">${h}</span></div>
  <div class="title">${c.hun}</div><div class="words">${c.words.map(w=>`<span>${mark(w)}</span>`).join('')}</div>
  <div class="row"><button class="soft" id="again">🔊 다시 듣기</button><button id="go">다음 ▶</button></div>`);
  const talk=()=>sayList([c.hun,...c.words.map(plain)]);
  setTimeout(()=>sfx('magic'),1300);setTimeout(talk,c.emoji?3000:800);$('again').onclick=talk;$('go').onclick=NEXT}

function match(chars){let left=chars.length,sel=null;
  const lab=h=>{const e=CH[h].emoji;return e&&chars.filter(x=>CH[x].emoji===e).length===1?[pic(e),'']:[CH[h].hun,' txt']};
  view(bar('짝 맞추기')+`<div class="title">그림과 한자를 짝지어요!</div><div class="grid" id="A" style="--n:${chars.length}"></div><div class="grid" id="B" style="--n:${chars.length}"></div>`);
  const mk=(box,h,isH)=>{const [html,cls]=isH?[h,' hj']:lab(h);const c=el('div','card'+cls,html+'<small></small>');c.h=h;c.isH=isH;c.onclick=()=>tap(c);$(box).append(c)};
  shuffle(chars).forEach(h=>mk('A',h,false));shuffle(chars).forEach(h=>mk('B',h,true));
  function tap(c){
    if(!sel||sel.isH===c.isH){sel?.classList.remove('sel');sel=c;c.classList.add('sel');sfx('tap');return}
    const a=sel;sel=null;a.classList.remove('sel');
    if(a.h===c.h){sfx('ok');a.classList.add('ok');c.classList.add('ok');(c.isH?c:a).querySelector('small').textContent=CH[c.h].hun;say(CH[c.h].hun);if(--left===0)setTimeout(NEXT,1400)}
    else{sfx('no');shakeEl(a);shakeEl(c);say('다시 찾아볼까?')}}}

// 고르기 공용: 틀리면 그 보기를 흐리게 → 남은 것 중 다시 고르기
function choice(o){let first=true,done=false;
  view(bar(o.head)+`<div class="title">${o.title}</div><div class="prompt ${o.bigCls||''}">${o.big}</div>${o.speak?'<button class="soft icon" id="spk">🔊</button>':''}<div class="grid" id="O" style="--n:${o.opts.length}"></div>`);
  if(o.speak){const s=()=>say(o.speak);$('spk').onclick=s;setTimeout(s,300)}
  shuffle(o.opts).forEach(op=>{const c=el('div','card '+(op.cls||''),op.html);
    c.onclick=()=>{if(done)return;
      if(op.ok){done=true;sfx('ok');c.classList.add('ok');if(op.after)c.innerHTML=op.after;say(o.okSay||pick(PRAISE));o.onAnswer&&o.onAnswer(first);setTimeout(NEXT,1500)}
      else{first=false;sfx('no');shakeEl(c);c.classList.add('dim');say('다시 찾아볼까?')}};
    $('O').append(c)})}
function others(h,n){const L=learned().filter(x=>x!==h);return shuffle(L.length>=n?L:Object.keys(CH).filter(x=>x!==h)).slice(0,n)}
function review(h,graded){(Math.random()<.5?pickHanja:pickWord)(h,graded?ok=>grade(h,ok):null)}
function pickHanja(h,on){const c=CH[h];
  choice({head:'글자 찾기',title:'이 글자를 찾아봐!',big:c.hun,bigCls:'txt',speak:c.hun,opts:[{html:h,cls:'hj',ok:true},...others(h,2).map(x=>({html:x,cls:'hj'}))],onAnswer:on})}
function pickWord(h,on){const c=CH[h],right=pick(c.words),L=learned().filter(x=>x!==h);
  const ds=distractWords(h,2,L.length>=3?L:Object.keys(CH));
  choice({head:'단어 찾기',title:'이 글자가 들어간 말은?',big:h,bigCls:'hj',opts:[{html:plain(right),cls:'txt',ok:true,after:mark(right)+`<small>${c.hun}</small>`},...ds.map(w=>({html:plain(w),cls:'txt'}))],onAnswer:on,okSay:`${plain(right)}! ${c.hun}`})}
function similar(s){const t=pick([...s]);
  choice({head:'닮은꼴 찾기',title:'👀 닮은꼴! 어느 것일까?',big:CH[t].hun,bigCls:'txt',speak:CH[t].hun,opts:[...s].map(x=>({html:x,cls:'hj',ok:x===t})),okSay:CH[t].hun})}

function lego([hz,rd,hint]){const need=[...hz];let k=0;
  const extra=shuffle(learned().filter(x=>!need.includes(x))).slice(0,2),tiles=shuffle([...need,...extra]);
  view(bar('한자 레고')+`<div class="title" id="lt">🧱 글자를 합쳐서 「${rd}」 만들기!</div><div class="sub">${hint}</div>
  <div class="slots">${need.map((_,i)=>`<div class="slot hj" id="s${i}"></div>`).join('')}</div><div class="grid" id="T" style="--n:${tiles.length}"></div>`);
  say(`${rd}, 만들어 볼까?`);
  tiles.forEach(x=>{const t=el('div','card hj',x+`<small>${CH[x].hun}</small>`);
    t.onclick=()=>{if(k>=need.length)return;
      if(x===need[k]){sfx('pop');$('s'+k).textContent=x;t.classList.add('ok');say(CH[x].hun);
        if(++k===need.length)setTimeout(()=>{sfx('magic');$('lt').innerHTML=`🎉 <span class="hj">${hz}</span> = ${rd}`;say(`${rd}! ${hint}`);setTimeout(NEXT,2400)},700)}
      else{sfx('no');shakeEl(t);say('다른 글자일까?')}};
    $('T').append(t)})}

function finish(g,isReplay){
  if(g){const m=g.mission;
    view(bar()+`<div class="title">스티커를 받았어!</div><div class="sticker">${pic(firstEmoji(g))}</div><div class="title hj">${g.chars.join(' ')}</div>
    <div class="panel" style="text-align:center">🔎 오늘의 미션<br>${m}</div><button class="big-btn" onclick="goHome()">기차역으로 🚂</button>`);
    sfx('win');sayList(['스티커를 받았어!','오늘의 미션',m])}
  else{view(bar()+`<div class="title">${isReplay?'다시 보기 끝!':'오늘도 잘했어! 🎉'}</div><div class="sticker">${ico('trophy')}</div><button class="big-btn" onclick="goHome()">기차역으로 🚂</button>`);sfx('win');say('잘했어!')}}

function detective(){const set=pick(HOMO),items=shuffle(set.bins.flatMap((b,bi)=>b[3].map(w=>({w,bi})))).slice(0,6);let k=0,busy=false;
  view(bar('동음 탐정')+`<div class="title">🔍 「${set.s}」는 다 같은 「${set.s}」일까?</div><div class="prompt txt" id="W"></div>
  <div class="bins" style="--n:${set.bins.length}">${set.bins.map((b,i)=>`<div class="bin" id="b${i}"><span class="e">${b[1]}</span>${b[2]}<span class="got"></span></div>`).join('')}</div><div id="end"></div>`);
  const show=()=>{if(k>=items.length)return end();$('W').innerHTML=items[k].w.replace(set.s,`<b class="k">${set.s}</b>`);say(items[k].w);busy=false};
  set.bins.forEach((b,i)=>$('b'+i).onclick=e=>{if(busy||k>=items.length)return;const x=e.currentTarget;
    if(items[k].bi===i){busy=true;sfx('ok');const got=x.querySelector('.got');got.textContent+=(got.textContent?' · ':'')+items[k].w;say(`맞아! ${items[k].w}의 ${set.s}는 ${b[2]}`);k++;setTimeout(show,1800)}
    else{sfx('no');shakeEl(x);say('음, 다른 뜻일까?')}});
  function end(){sfx('win');$('W').textContent='🎉 소리는 같아도 글자는 달라요!';set.bins.forEach((b,i)=>$('b'+i).querySelector('.e').innerHTML=`<span class="hj">${b[0]}</span>`);
    say('소리는 같아도 글자는 달라요!');$('end').innerHTML='<div class="row"><button onclick="detective()">한 번 더</button><button class="soft" onclick="goHome()">기차역으로</button></div>'}
  show()}

function book(){view(bar('스티커북')+`<div class="book">${GROUPS.map(g=>{const d=S.done.includes(g.i);
  return `<div class="${d?(mastered(g)?'gold':''):'no'}"><b>${d?pic(firstEmoji(g)):'❔'}</b><span class="hj">${d?g.chars.join(''):''}</span><br>${g.name}</div>`}).join('')}</div><div class="sub">⭐ 금테두리 = 복습까지 완벽!</div>`)}

function parentView(){const t=today();
  const rows=['1A','1B','2','3','4','5'].map(s=>{const gs=GROUPS.filter(g=>g.stage===s),d=gs.filter(g=>S.done.includes(g.i)),m=d.filter(mastered).length;
    return `<tr><td>${s}단계</td><td style="width:45%"><div class="bar"><i style="width:${d.length/gs.length*100}%"></i></div></td><td>${d.length}/${gs.length}역 · 완벽 ${m}</td></tr>`}).join('');
  const weak=learned().filter(h=>S.cards[h].wrong).sort((a,b)=>S.cards[b].wrong-S.cards[a].wrong).slice(0,8);
  view(bar('부모 화면')+`<div class="panel"><table>${rows}</table></div>
  <div class="panel">배운 글자 ${learned().length}/${Object.keys(CH).length} · 오늘 복습 ${learned().filter(h=>S.cards[h].due<=t).length}개<br>자주 틀린 글자: <span class="hj">${weak.map(h=>`${h}(${S.cards[h].wrong})`).join(' ')||'없음'}</span></div>
  <div class="panel">하루 새 역 1개가 기본. 더 하려면 홈의 「➕ 새 역 하나 더」.<br>복습 간격: 1일 → 3일 → 7일 → 14일 → 30일. 틀리면 다음 날 다시.<br>역 금테두리 = 모든 글자를 복습에서 두 번 이상 맞힘.</div>
  <div class="row"><button class="soft" onclick="S.off++;save();parentView()">⏩ 하루 지나기 (테스트)</button><button class="soft" id="rs">처음부터 다시</button></div>`);
  const rs=$('rs');rs.onclick=()=>{if(rs.dataset.k){S=fresh();save();goHome()}else{rs.dataset.k=1;rs.textContent='정말요? 한 번 더 누르면 지워져요'}}}

load();goHome();
</script>
</body>
